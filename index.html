<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Tic-Tac-Toe</h1>

    <div class="container">
    </div>

    <p class="info-text">Game Info: <span class="game-info"></span></p>

    <button type="button" class="restart-button">Restart</button>

    <dialog class="newGameDialog">
        <form action="" method="" class="newGameForm">
            <div class="newGameHeader">
                <h2>Welcome, Friends!</h2>
                <button type="button" class="newGameBtn">Ok</button>
            </div>

            <fieldset>
                <legend>What are your names?</legend>
                <label for="player1">Player 1:</label>
                <input type="text" id="player1" name="player1" />

                <label for="player2">Player 2:</label>
                <input type="text" id="player2" name="player2" />
            </fieldset>
        </form>
    </dialog>

    <script src="index.js"></script>
</body>
</html>
